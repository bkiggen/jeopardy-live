# See https://fly.io/docs/reference/configuration/

# REPLACE this with the app name you choose during `fly launch`.
app = "standup-jeopardy"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Apply pending Prisma migrations before the new release replaces the old.
  release_command = "npx prisma migrate deploy"

[env]
  # Internal listen port the app binds to. Fly maps 80/443 -> this port.
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # WebSockets need a persistent process
  auto_start_machines = true
  min_machines_running = 1     # keep a worker hot so sockets reconnect cleanly
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
